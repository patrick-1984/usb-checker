name: Validate release candidate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: PYTHONPATH=host python -m unittest discover -s tests -v
      - run: python -m compileall -q host
      - run: node --check mcp/server.mjs
      - run: sh -n host/install.sh
      - run: python scripts/build.py
      - run: cd dist && sha256sum -c SHA256SUMS
